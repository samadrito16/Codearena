<!doctype html>
<html lang="en" class="dark" data-palette="onyx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="description" content="PrismCode — practice, compete, and grow as a developer." />
    <title>PrismCode — High-Performance Algorithmic Engineering Platform</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('prismcode-theme') || localStorage.getItem('codearena-theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }

          var palette = localStorage.getItem('prismcode-palette') || localStorage.getItem('codearena-palette');
          var validPalettes = ['onyx', 'frost', 'copper', 'crimson', 'dune'];
          if (palette && validPalettes.indexOf(palette) !== -1) {
            document.documentElement.setAttribute('data-palette', palette);
          } else {
            document.documentElement.setAttribute('data-palette', 'onyx');
          }

          var font = localStorage.getItem('prismcode-font') || localStorage.getItem('codearena-font');
          if (font) {
            document.documentElement.setAttribute('data-font', font);
          }

          var fontSize = localStorage.getItem('prismcode-font-size') || localStorage.getItem('codearena-font-size');
          if (fontSize) {
            document.documentElement.setAttribute('data-font-size', fontSize);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/brand/prismcode-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,400..800;1,400..800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@400,500,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
