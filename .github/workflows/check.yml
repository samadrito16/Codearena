name: PrismCode checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prismcode
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: prismcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prismcode -d prismcode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prismcode:ci_only@127.0.0.1:5432/prismcode_test
      DIRECT_DATABASE_URL: postgresql://prismcode:ci_only@127.0.0.1:5432/prismcode_test
      CONTENT_TEST_DATABASE_URL: postgresql://prismcode:ci_only@127.0.0.1:5432/prismcode_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run build
      - run: npm --prefix backend run build
      - run: npm --prefix backend run db:migrate
      - run: npm --prefix backend run db:seed:learning-paths
      - run: npm --prefix backend run db:seed:learning-paths
      - run: node backend/tests/learningPathPublishing.test.mjs
